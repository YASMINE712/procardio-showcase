<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="516" viewBox="0 0 1200 516" role="img"><title>Model lifecycle: training choices meet application behavior</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e86"/></marker></defs><rect x="0" y="0" width="1200" height="516" rx="0" fill="#f4f8fb" stroke="#f4f8fb"/><text x="48" y="57" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650" fill="#233e52">Model lifecycle: training choices meet application behavior</text><text x="48" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">A conceptual walkthrough of training, evaluation, and integration</text><text x="48" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#087e86">01</text><rect x="48" y="168" width="252" height="185" rx="16" fill="white" stroke="#d4e1e8"/><rect x="66" y="190" width="5" height="28" rx="2" fill="#087e86" stroke="#087e86"/><text x="85" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#233e52">Prepare</text><text x="72" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Separate dataset splits</text><text x="72" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Consistent preprocessing</text><text x="72" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Pretrained initialization</text><path d="M 300 260 L 321 260" fill="none" stroke="#087e86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="328" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#087e86">02</text><rect x="328" y="168" width="252" height="185" rx="16" fill="white" stroke="#d4e1e8"/><rect x="346" y="190" width="5" height="28" rx="2" fill="#087e86" stroke="#087e86"/><text x="365" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#233e52">Train</text><text x="352" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Aligned augmentation</text><text x="352" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Gradient updates</text><text x="352" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Save checkpoints</text><path d="M 580 260 L 601 260" fill="none" stroke="#087e86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="608" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#087e86">03</text><rect x="608" y="168" width="252" height="185" rx="16" fill="white" stroke="#d4e1e8"/><rect x="626" y="190" width="5" height="28" rx="2" fill="#087e86" stroke="#087e86"/><text x="645" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#233e52">Evaluate</text><text x="632" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Validation selection</text><text x="632" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Held-out test metrics</text><text x="632" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Review failure cases</text><path d="M 860 260 L 881 260" fill="none" stroke="#087e86" stroke-width="2.5" marker-end="url(#arrow)"/><text x="888" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#087e86">04</text><rect x="888" y="168" width="252" height="185" rx="16" fill="white" stroke="#d4e1e8"/><rect x="906" y="190" width="5" height="28" rx="2" fill="#087e86" stroke="#087e86"/><text x="925" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#233e52">Integrate</text><text x="912" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Identify runtime weights</text><text x="912" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Run image inference</text><text x="912" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Present reviewable output</text><rect x="48" y="392" width="1104" height="86" rx="16" fill="#e8f3f4" stroke="#d2e6e8"/><text x="71" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#233e52">Existing training and runtime paths need an explicit link to the same evaluated checkpoint.</text><text x="71" y="452" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#233e52">Proposed improvement: connect data, configuration, metrics, and weights in a release manifest.</text></svg>