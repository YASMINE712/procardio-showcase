<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>Hospital-scoped requests in a shared application</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e86"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f4f8fb" stroke="#f4f8fb"/><text x="48" y="57" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="650" fill="#233e52">Multi-tenant design: shared application, scoped access</text><text x="48" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Hospital context and permissions participate in server-side data access.</text><rect x="48" y="142" width="300" height="154" rx="16" fill="white" stroke="#d4e1e8"/><rect x="66" y="164" width="5" height="28" rx="2" fill="#087e86" stroke="#087e86"/><text x="85" y="186" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#233e52">Hospital A user</text><text x="72" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Authenticated hospital context</text><text x="72" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Current account and role checks</text><rect x="48" y="343" width="300" height="154" rx="16" fill="white" stroke="#d4e1e8"/><rect x="66" y="365" width="5" height="28" rx="2" fill="#087e86" stroke="#087e86"/><text x="85" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#233e52">Hospital B user</text><text x="72" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Authenticated hospital context</text><text x="72" y="453" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Current account and role checks</text><rect x="439" y="217" width="330" height="200" rx="16" fill="white" stroke="#d4e1e8"/><rect x="457" y="239" width="5" height="28" rx="2" fill="#087e86" stroke="#087e86"/><text x="476" y="261" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#233e52">Application boundary</text><text x="463" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Validate session and permissions</text><text x="463" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Scope records and related objects</text><text x="463" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Resolve the hospital configuration</text><path d="M 348 220 L 425 275" fill="none" stroke="#087e86" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 348 420 L 425 358" fill="none" stroke="#087e86" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="861" y="142" width="291" height="355" rx="16" fill="#eaf2f6" stroke="#a8bfce"/><text x="885" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#233e52">Shared PostgreSQL</text><rect x="885" y="212" width="242" height="66" rx="16" fill="white" stroke="#d4e1e8"/><text x="907" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#087e86">Hospital A records</text><rect x="885" y="299" width="242" height="66" rx="16" fill="white" stroke="#d4e1e8"/><text x="907" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#087e86">Hospital B records</text><text x="886" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Organization-scoped</text><text x="886" y="439" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">queries select the rows.</text><path d="M 769 317 L 846 317" fill="none" stroke="#087e86" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="547" width="1104" height="92" rx="16" fill="white" stroke="#d4e1e8"/><text x="73" y="583" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#087e86">CONFIGURATION</text><text x="267" y="583" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#233e52">Shared defaults + hospital overrides = effective workflow</text><text x="267" y="613" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#607586">Platform administration uses a separate account and authentication path.</text><text x="48" y="684" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#607586">Logical access isolation in application queries; separate hospital databases are not depicted.</text></svg>